name: Deploy

# 手动触发：部署集群包（唯一的发行形态，instances=1 即单实例）
#
#   cold   : 停止现有实例 → 解压完整包到 DEPLOY_PATH → 启动全部实例（首次部署 / 全量覆盖）
#   hot    : 只替换 module/*.so、config/、scripts/ → rolling-restart all
#   module : 只替换 module/*.so（旧文件备份为 *.so.prev），不重启任何实例；
#            由用户自己上服务器 reload 指定实例，适合灰度验证
#   stop   : clusterctl stop all
#
# 产物来源（amd64）：
#   - tag  : 该 tag GitHub Release 的 techhaven-cluster-*amd64*.tar.gz
#   - 分支 : 该分支最近一次成功的 "Build & Package" artifact techhaven-cluster-amd64
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 部署模式
        type: choice
        required: true
        default: cold
        options: [ cold, hot, module, stop ]

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve + download cluster package
        if: inputs.mode != 'stop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p pkg
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "==> 产物来源: Release ${GITHUB_REF_NAME}"
            gh release download "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern 'techhaven-cluster-*amd64*.tar.gz' --dir pkg --clobber
          else
            echo "==> 产物来源: 分支 ${GITHUB_REF_NAME} 最近一次成功的 Build & Package"
            run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" \
              --workflow "Build & Package" --branch "${GITHUB_REF_NAME}" \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
            if [ -z "${run_id}" ]; then
              echo "错误: 分支 ${GITHUB_REF_NAME} 没有成功的 Build & Package 运行，请先触发构建" >&2
              exit 1
            fi
            gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" \
              -n techhaven-cluster-amd64 -D pkg
          fi
          ls -l pkg
          pkg="$(find pkg -name '*amd64*.tar.gz' | head -1)"
          test -n "${pkg}" || { echo "错误: 未找到集群包" >&2; exit 1; }

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload package
        if: inputs.mode != 'stop'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          pkg="$(find pkg -name '*amd64*.tar.gz' | head -1)"
          test -n "${pkg}"
          size=$(stat -c%s "${pkg}")

          SSH_BASE=(-p "${SSH_PORT}" -i ~/.ssh/id_ed25519
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=10
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4)

          REMOTE_TMP=/tmp/techhaven-cluster.tar.gz.part
          REMOTE_DST=/tmp/techhaven-cluster.tar.gz

          fmt_bytes() {
            numfmt --to=iec-i --suffix=B --format='%.1f' "$1"
          }

          remote_size() {
            ssh "${SSH_BASE[@]}" "${SSH_USER}@${SSH_HOST}" \
              "stat -c%s '${REMOTE_TMP}' 2>/dev/null" 2>/dev/null || true
          }

          format_progress() {
            awk -v cur="$1" -v total="$2" -v initial="$3" -v elapsed="$4" '
              function human(n) {
                split("B KiB MiB GiB TiB", unit, " ");
                i = 1;
                while (n >= 1024 && i < 5) { n /= 1024; i++ }
                return sprintf("%.1f %s", n, unit[i]);
              }
              function eta(seconds) {
                if (seconds < 0 || seconds != seconds) return "--:--";
                if (seconds >= 3600) {
                  return sprintf("%d:%02d:%02d", seconds / 3600, (seconds % 3600) / 60, seconds % 60);
                }
                return sprintf("%02d:%02d", seconds / 60, seconds % 60);
              }
              BEGIN {
                pct = total > 0 ? int(cur * 100 / total) : 0;
                if (pct > 100) pct = 100;
                speed = elapsed > 0 ? (cur - initial) / elapsed : 0;
                if (speed < 0) speed = 0;
                remain = speed > 0 ? (total - cur) / speed : -1;
                printf("  上传进度 %3d%%  %s/%s  %s/s  ETA %s\n",
                       pct, human(cur), human(total), human(speed), eta(remain));
              }'
          }

          echo "==> 开始上传 $(basename "${pkg}") ($(fmt_bytes "${size}"))"

          start_size=0
          if ssh "${SSH_BASE[@]}" "${SSH_USER}@${SSH_HOST}" 'command -v rsync >/dev/null 2>&1'; then
            echo "==> 使用 rsync（支持续传）"
            existing="$(remote_size)"
            existing="${existing//[!0-9]/}"
            [ -n "${existing}" ] && start_size="${existing}"
            RSYNC_SSH="ssh -p ${SSH_PORT} -i ${HOME}/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
            rsync -a --partial --timeout=60 -e "${RSYNC_SSH}" \
              "${pkg}" "${SSH_USER}@${SSH_HOST}:${REMOTE_TMP}" &
          else
            echo "==> 远端没有 rsync，使用 scp + 轮询进度"
            scp "${SSH_BASE[@]}" "${pkg}" "${SSH_USER}@${SSH_HOST}:${REMOTE_TMP}" &
          fi
          up_pid=$!

          start_ts=$(date +%s)
          last_report=-1
          last_report_ts=${start_ts}

          while kill -0 "${up_pid}" 2>/dev/null; do
            sleep 5
            cur="$(remote_size)"
            cur="${cur//[!0-9]/}"
            [ -z "${cur}" ] && continue
            [ "${cur}" -gt "${size}" ] && cur="${size}"
            now=$(date +%s)
            elapsed=$((now - start_ts))
            [ "${elapsed}" -le 0 ] && elapsed=1
            pct=0
            [ "${size}" -gt 0 ] && pct=$((cur * 100 / size))
            if [ "${pct}" -ge $((last_report + 5)) ] || [ $((now - last_report_ts)) -ge 10 ]; then
              format_progress "${cur}" "${size}" "${start_size}" "${elapsed}"
              last_report="${pct}"
              last_report_ts="${now}"
            fi
          done

          rc=0
          wait "${up_pid}" || rc=$?
          if [ "${rc}" -ne 0 ]; then
            echo "==> 上传失败（已传 $(fmt_bytes "${cur:-0}") / $(fmt_bytes "${size}")）"
            exit "${rc}"
          fi

          end_ts=$(date +%s)
          elapsed=$((end_ts - start_ts))
          [ "${elapsed}" -le 0 ] && elapsed=1
          uploaded=$((size - start_size))
          [ "${uploaded}" -lt 0 ] && uploaded=0
          avg_speed=$((uploaded / elapsed))
          echo "==> 上传完成 $(fmt_bytes "${size}")，用时 ${elapsed}s（$(fmt_bytes "${avg_speed}")/s）"

          ssh "${SSH_BASE[@]}" "${SSH_USER}@${SSH_HOST}" "mv -f ${REMOTE_TMP} ${REMOTE_DST}"
          echo "==> 已写入: ${REMOTE_DST}"

      - name: Run deploy on server
        run: |
          SSH_OPTS=(-p "${SSH_PORT}" -i ~/.ssh/id_ed25519
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=10
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          MODE='${{ inputs.mode }}'
          DP="${DEPLOY_PATH}"
          ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" \
            "MODE='${MODE}' DEPLOY_PATH='${DP}' bash -s" <<'REMOTE'
            set -euo pipefail
            : "${DEPLOY_PATH:?DEPLOY_PATH 未配置（vars.DEPLOY_PATH）}"

            case "$MODE" in
              cold)
                if [ -x "$DEPLOY_PATH/scripts/clusterctl.sh" ]; then
                  ( cd "$DEPLOY_PATH" && ./scripts/clusterctl.sh stop all ) || true
                fi
                mkdir -p "$DEPLOY_PATH"
                tar xzf /tmp/techhaven-cluster.tar.gz -C "$DEPLOY_PATH"
                chmod +x "$DEPLOY_PATH/server" "$DEPLOY_PATH"/scripts/*.sh
                cd "$DEPLOY_PATH"
                ./scripts/clusterctl.sh start all
                ./scripts/clusterctl.sh health all
                ;;
              hot)
                tmp="$(mktemp -d)"
                trap 'rm -rf "$tmp"' EXIT
                tar xzf /tmp/techhaven-cluster.tar.gz -C "$tmp"
                mkdir -p "$DEPLOY_PATH/module" "$DEPLOY_PATH/scripts"
                for so in "$tmp"/module/*.so; do
                  [ -f "$so" ] || continue
                  base="$(basename "$so")"
                  cp -f "$so" "$DEPLOY_PATH/module/$base.new"
                  mv -f "$DEPLOY_PATH/module/$base.new" "$DEPLOY_PATH/module/$base"
                done
                if [ -d "$tmp/config" ]; then
                  rm -rf "$DEPLOY_PATH/config"
                  cp -R "$tmp/config" "$DEPLOY_PATH/config"
                fi
                cp -f "$tmp"/scripts/*.sh "$DEPLOY_PATH/scripts/"
                chmod +x "$DEPLOY_PATH/scripts/"*.sh
                cd "$DEPLOY_PATH"
                ./scripts/clusterctl.sh rolling-restart all
                ./scripts/clusterctl.sh health all
                ;;
              module)
                tmp="$(mktemp -d)"
                trap 'rm -rf "$tmp"' EXIT
                tar xzf /tmp/techhaven-cluster.tar.gz -C "$tmp"
                mkdir -p "$DEPLOY_PATH/module"
                for so in "$tmp"/module/*.so; do
                  [ -f "$so" ] || continue
                  base="$(basename "$so")"
                  if [ -f "$DEPLOY_PATH/module/$base" ]; then
                    cp -f "$DEPLOY_PATH/module/$base" "$DEPLOY_PATH/module/$base.prev"
                  fi
                  cp -f "$so" "$DEPLOY_PATH/module/$base.new"
                  mv -f "$DEPLOY_PATH/module/$base.new" "$DEPLOY_PATH/module/$base"
                  echo "==> 已替换 module/$base（旧文件备份为 $base.prev）"
                done
                rm -rf "$tmp"
                trap - EXIT
                echo "==> 模块已替换，未重启任何实例"
                echo "    灰度单个实例:"
                echo "      cd $DEPLOY_PATH && ./scripts/clusterctl.sh reload <name>"
                echo "      cd $DEPLOY_PATH && ./scripts/clusterctl.sh health <name>"
                echo "    全量:"
                echo "      cd $DEPLOY_PATH && ./scripts/clusterctl.sh rolling-restart all"
                echo "    回滚:"
                echo "      cd $DEPLOY_PATH/module"
                echo '      for f in *.so.prev; do mv "$f" "${f%.prev}"; done'
                echo "      cd $DEPLOY_PATH && ./scripts/clusterctl.sh rolling-restart all"
                ;;
              stop)
                cd "$DEPLOY_PATH"
                ./scripts/clusterctl.sh stop all
                ;;
              *)
                echo "未知模式: $MODE" >&2
                exit 2
                ;;
            esac
            rm -f /tmp/techhaven-cluster.tar.gz
          REMOTE
