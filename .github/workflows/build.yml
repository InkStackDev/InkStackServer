name: Build & Package

# 触发：
#   - 手动 workflow_dispatch（直接出 Actions artifact）
#   - 打 tag v* → 额外发布到 GitHub Release
#
# 打包参数全部取自仓库 Variables，无需在触发时填写：
#   PKG_ENV（默认 prod）/ CLUSTER_INSTANCES / DEPLOY_PATH / CLUSTER_LOG_ROOT
#
# 产物只有"集群包"一种形态：techhaven-cluster-<tag>-<arch>.tar.gz
#   CLUSTER_INSTANCES=1 即单实例包
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/*
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PKG_ENV: ${{ vars.PKG_ENV || 'prod' }}
  PKG_INSTANCES: ${{ vars.CLUSTER_INSTANCES || '3' }}
  PKG_DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/techhaven' }}
  PKG_LOG_ROOT: ${{ vars.CLUSTER_LOG_ROOT || '/data/apps' }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Switch apt mirror
        run: |
          # GitHub 托管 runner 默认走 Azure 镜像，下载系统库容易卡住，切换到官方源
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update

      - name: Install system dependencies
        run: |
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            rsync \
            python3 \
            gettext \
            libboost-context-dev \
            libtool \
            gcc \
            g++ \
            autoconf \
            automake \
            cmake \
            libboost-all-dev \
            libsqlite3-dev \
            libssl-dev \
            libevent-dev \
            libmysqlclient-dev \
            ccache \
            redis \
            libnghttp2-dev \
            git \
            wget \
            unzip \
            zip

      - name: Fetch chen-sdk + thirdparty deps
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 deps.py sync

      - name: Apply SDK (bin / tools / protocol / resources)
        run: make apply

      - name: Generate ORM data
        run: make orm

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.arch }}-${{ hashFiles('src/**') }}
          restore-keys: ccache-${{ matrix.arch }}-

      - name: Configure (Release, Ninja)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Prepare prod.env (from GitHub Secrets)
        if: env.PKG_ENV == 'prod'
        env:
          WORK_PATH: ${{ vars.WORK_PATH }}
          DATA_PATH: ${{ vars.DATA_PATH || '/data/apps/data' }}
          LOG_DIR: ${{ vars.LOG_DIR || '/data/apps/logs' }}
          PROCESS_NAME: ${{ vars.PROCESS_NAME || 'techhaven' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          HTTP_PORT: ${{ vars.HTTP_PORT || '8090' }}
          WS_PORT: ${{ vars.WS_PORT || '8091' }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWD: ${{ secrets.MYSQL_PASSWD }}
          MYSQL_DBNAME: ${{ secrets.MYSQL_DBNAME }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_DBNAME: ${{ secrets.REDIS_DBNAME }}
          SEARCH_HUB_ADDRESS: ${{ vars.SEARCH_HUB_ADDRESS || '127.0.0.1:9010' }}
          INSTANCE_ID: ${{ vars.INSTANCE_ID || '1' }}
          RPC_HUB_ADDRESS: ${{ vars.RPC_HUB_ADDRESS || '127.0.0.1:9010' }}
          RPC_BUS_ID: ${{ vars.RPC_BUS_ID || '1.1.2.1' }}
          ADMIN_PASSWD: ${{ secrets.ADMIN_PASSWD }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GITHUB_CALLBACK_URL: ${{ secrets.OAUTH_GITHUB_CALLBACK_URL }}
          FRONTEND_BASE: ${{ vars.FRONTEND_BASE }}
          AUTH_COOKIE_SECURE: "true"
          WEBAUTHN_RP_ID: ${{ vars.WEBAUTHN_RP_ID }}
          WEBAUTHN_RP_NAME: ${{ vars.WEBAUTHN_RP_NAME }}
          WEBAUTHN_ORIGIN: ${{ vars.WEBAUTHN_ORIGIN }}
          WEBAUTHN_USER_HANDLE_SECRET: ${{ secrets.WEBAUTHN_USER_HANDLE_SECRET }}
        run: |
          {
            echo "WORK_PATH=${WORK_PATH:-/opt/techhaven}"
            echo "DATA_PATH=${DATA_PATH:-/data/apps/data}"
            echo "LOG_DIR=${LOG_DIR:-/data/apps/logs}"
            echo "PROCESS_NAME=${PROCESS_NAME:-techhaven}"
            echo "LOG_LEVEL=${LOG_LEVEL:-info}"
            echo "HTTP_PORT=${HTTP_PORT:-8090}"
            echo "WS_PORT=${WS_PORT:-8091}"
            echo "MYSQL_HOST=${MYSQL_HOST:-change.me}"
            echo "MYSQL_PORT=${MYSQL_PORT:-3306}"
            echo "MYSQL_USER=${MYSQL_USER:-change.me}"
            echo "MYSQL_PASSWD=${MYSQL_PASSWD:-change.me}"
            echo "MYSQL_DBNAME=${MYSQL_DBNAME:-techhaven}"
            echo "REDIS_HOST=${REDIS_HOST:-127.0.0.1:6379}"
            echo "REDIS_DBNAME=${REDIS_DBNAME:-blog}"
            echo "SEARCH_HUB_ADDRESS=${SEARCH_HUB_ADDRESS:-127.0.0.1:9010}"
            echo "INSTANCE_ID=${INSTANCE_ID:-1}"
            echo "RPC_HUB_ADDRESS=${RPC_HUB_ADDRESS:-127.0.0.1:9010}"
            echo "RPC_BUS_ID=${RPC_BUS_ID:-1.1.2.1}"
            echo "ADMIN_PASSWD=${ADMIN_PASSWD:-}"
            echo "GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}"
            echo "GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}"
            echo "GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL}"
            echo "FRONTEND_BASE=${FRONTEND_BASE}"
            echo "AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-true}"
            echo "WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-change.me}"
            echo "WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-InkStack}"
            echo "WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-https://change.me}"
            echo "WEBAUTHN_USER_HANDLE_SECRET=${WEBAUTHN_USER_HANDLE_SECRET:-}"
          } > bin/conf/prod.env

      - name: Package cluster
        run: |
          ./scripts/cluster/package-cluster.sh "${PKG_ENV}" \
            --instances "${PKG_INSTANCES}" \
            --deploy-path "${PKG_DEPLOY_PATH}" \
            --log-root "${PKG_LOG_ROOT}"

      - name: Rename cluster package (tag + arch)
        run: |
          tag="${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}"
          mv techhaven-cluster-*.tar.gz "techhaven-cluster-${tag}-${{ matrix.arch }}.tar.gz"
          sha256sum "techhaven-cluster-${tag}-${{ matrix.arch }}.tar.gz" \
            > "techhaven-cluster-${tag}-${{ matrix.arch }}.tar.gz.sha256"

      - name: Upload cluster package
        uses: actions/upload-artifact@v4
        with:
          name: techhaven-cluster-${{ matrix.arch }}
          path: |
            techhaven-cluster-*.tar.gz
            techhaven-cluster-*.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract changelog for this version
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v prefix="## v${VER}" '
            index($0, prefix) == 1 && (length($0) == length(prefix) || substr($0, length(prefix) + 1, 1) == " ") { found=1; next }
            found && /^## v/ { exit }
            found
          ' CHANGELOG.md > /tmp/release_body.md

          if [ ! -s /tmp/release_body.md ]; then
            printf 'Release %s\n' "${GITHUB_REF_NAME}" > /tmp/release_body.md
          fi

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file /tmp/release_body.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --title "${GITHUB_REF_NAME}" \
              --notes-file /tmp/release_body.md
          fi

          gh release upload "${GITHUB_REF_NAME}" artifacts/*.tar.gz artifacts/*.sha256 \
            --repo "${GITHUB_REPOSITORY}" --clobber
