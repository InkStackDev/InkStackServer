# Nginx 反向代理示例（多实例）
#
# - /api/ 转发到各实例的 HTTP 端口（8090、8190…）
# - /ws/  转发到各实例的 WebSocket 端口（8091、8191…），必须带 Upgrade/Connection 头
# - 实例间不需要粘性会话：登录态在 Redis，WS 路由由 Redis presence 完成
# - 按实际实例数与端口修改 upstream 列表

upstream techhaven_api {
    server 127.0.0.1:8090;
    server 127.0.0.1:8190;
    keepalive 64;
}

upstream techhaven_ws {
    server 127.0.0.1:8091;
    server 127.0.0.1:8191;
    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name example.com;

    # 与业务侧上传上限保持一致
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://techhaven_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://techhaven_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长连接空闲超时要大于业务心跳间隔
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
